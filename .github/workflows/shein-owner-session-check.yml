name: SHEIN Owner Session Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node worker syntax
        run: |
          node --check scripts/shein-shared-page-import.mjs
          node --check scripts/shein-login-local.mjs
          node --check scripts/shein-shared-page-retry.mjs
      - name: Static account session tests
        run: node --test tests/static/shein-owner-session.test.mjs
      - name: PHP controller and vault syntax
        run: |
          php -l app/Services/CartImport/SheinSessionVault.php
          php -l app/Http/Controllers/Admin/SheinAccountSessionController.php
          php -l app/Services/CartImport/Browser/SheinBrowserImporter.php
          php -l database/migrations/2026_10_09_210000_create_shein_account_sessions_table.php
          php -l routes/web.php
          php -l app/Services/CartImport/SheinSharedCartInput.php
          php -l tests/static/shein-share-input-check.php
      - name: Shared cart link input checks
        run: php tests/static/shein-share-input-check.php
      - name: Owner-session empty-cart fallback guards
        run: |
          php -l app/Services/CartImport/Adapters/SheinShareAdapter.php
          php -l tests/static/shein-owner-guest-fallback-check.php
          php tests/static/shein-owner-guest-fallback-check.php

      - name: SHEIN www domain consistency
        run: |
          php -l app/Services/CartImport/SheinProductUrl.php
          php -l database/migrations/2026_10_09_233500_normalize_existing_shein_product_hosts.php
          php -l tests/static/shein-www-product-links-check.php
          php tests/static/shein-www-product-links-check.php
          node --test tests/static/shein-ae-pricing.test.mjs tests/static/shein-share-bff-items.test.mjs
          node --test tests/static/shein-www-shared-cart-fallback.test.mjs
      - name: Owner www product price comparison checks
        run: |
          node --check scripts/shein-www-account-price-probe.mjs
          node --test tests/static/shein-www-price-probe.test.mjs
          php -l app/Http/Controllers/Admin/SheinAccountSessionController.php

      - name: SHEIN local PHP and browser timeout regression
        run: |
          php -l app/Http/Controllers/CartController.php
          php -l app/Services/CartImport/Browser/SheinBrowserImporter.php
          php -l app/Services/CartImport/Adapters/SheinShareAdapter.php
          php -l config/services.php
          node --test tests/static/shein-cart-time-budget.test.mjs

      - name: SHEIN owner-price provenance safeguards
        run: |
          php -l app/Services/CartImport/Adapters/SheinShareAdapter.php
          node --test tests/static/shein-price-provenance.test.mjs
